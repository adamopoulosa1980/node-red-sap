# ci: the unit and Node-RED runtime tests on every supported Node.js line, then one coverage report.
#
# Laid out like atlas's ci.yml: one leg of the test matrix collects coverage and publishes it as an
# artifact; the `coverage` job READS what was measured instead of running the suite again, writes the
# numbers into the job summary and publishes an HTML report a person can open.
#
# The 100 % gate is not here but in `npm test` itself (node --test --test-coverage-lines/branches/
# functions=100), so every leg fails on a coverage drop and a laptop run fails the same way.
#
# The live tests (`test:trial` against the ABAP trial, `test:live` against sandbox.api.sap.com) need
# credentials and a reachable SAP system; they are not part of this workflow.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch cancels the run it supersedes rather than queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # every supported line reports, not only the first one to fail
      fail-fast: false
      matrix:
        # the LTS lines still supported (Node 20 reached end of life on 2026-04-30)
        node: [22, 24, 26]
        include:
          # one leg collects coverage for the `coverage` job; measuring all three would report the same
          # lines three times and triple the artifact for nothing
          - node: 26
            collect-coverage: 'yes'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests with the 100 % coverage gate
        if: matrix.collect-coverage != 'yes'
        run: npm test
      # same suite and gate, plus the lcov file the report is made from - one run, not two
      - name: Tests with the 100 % coverage gate, coverage data written
        if: matrix.collect-coverage == 'yes'
        run: npm run test:ci
      - name: Publish the coverage data
        if: matrix.collect-coverage == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # reads what the `test` job measured; it only runs once every leg passed
    needs: test
    steps:
      # the sources, for the HTML report's annotated files
      - uses: actions/checkout@v7
      # No setup-node and no npm ci: the summary script reads one file with node's standard library,
      # and the runner's own node does that.
      - name: Collect what the suite measured
        uses: actions/download-artifact@v8
        with:
          # every artifact of the run, so a second producer needs no edit here
          path: collected
      - name: Put the collected data where the report expects it
        run: |
          mkdir -p coverage
          find collected -name lcov.info -exec cp {} coverage/lcov.info \;
          test -s coverage/lcov.info
      # exits 1 rather than reporting 0 % if the data did not arrive
      - name: Coverage in the job summary
        run: node tools/coverage-summary.js coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report a person can read
        run: |
          sudo apt-get install -y --no-install-recommends lcov > /dev/null
          genhtml --version
          # lcov 2.x refuses two functions with one name in a file ("inconsistent"); node's lcov names arrow
          # functions after the property they are assigned to, so two `createConnection: () => ...` in
          # lib/http.js are legitimate. lcov 1.x does not know the category and needs no option.
          extra=()
          case "$(genhtml --version | grep -oE '[0-9]+\.[0-9]+' | head -1)" in 1.*) ;; *) extra=(--ignore-errors inconsistent) ;; esac
          genhtml coverage/lcov.info --output-directory coverage-html --title node-red-sap \
            --branch-coverage --function-coverage --quiet "${extra[@]}"
          test -f coverage-html/index.html
      - name: Publish the HTML report (open index.html)
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 30
