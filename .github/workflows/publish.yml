# publish: puts a release on npm through npm's Trusted Publishing (OIDC). No token is stored anywhere:
# GitHub issues a short-lived signed identity for this workflow run, npm checks it against the package's
# trusted publisher (repository adamopoulosa1980/node-red-sap, workflow file publish.yml) and the
# version gets a provenance statement saying which commit and workflow built it.
#
# Runs when a GitHub release is published, or by hand (Actions -> publish -> Run workflow). The version
# published is the one in package.json; a release tag v<version> must match it.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# never two publishes at once
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # the OIDC identity npm's Trusted Publishing checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or later
      - name: npm version
        run: npm --version
      - name: Install
        run: npm ci
      - name: Tests with the 100 % coverage gate
        run: npm test
      - name: The release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "release tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Not published yet
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm; raise the version in package.json" >&2
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --access public
      - name: Published version
        run: |
          name="$(node -p "require('./package.json').name")"
          npm view "$name" dist-tags versions --json | tee -a "$GITHUB_STEP_SUMMARY"
